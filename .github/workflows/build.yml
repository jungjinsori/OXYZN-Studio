name: Build OXYZN Studio

on:
  push:
    branches: [main]
    paths:
      - 'src/App.jsx'
      - 'electron/**'
      - 'package.json'
      - 'vite.config.js'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: oxyzn-mac
          path: dist-electron/*.dmg
          retention-days: 30

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: oxyzn-windows
          path: dist-electron/*.exe
          retention-days: 30
